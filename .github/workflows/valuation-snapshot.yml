name: PAPER账户独立估值快照

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: paper-valuation-snapshot
  cancel-in-progress: true

jobs:
  valuation:
    if: ${{ false }} # ALL ROBOT WORK PAUSED BY USER 2026-10-05
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 验证估值读取重试边界
        run: python -m unittest -v test_refresh_paper_valuations.py
      - name: 刷新PAPER账户估值
        run: python scripts/refresh_paper_valuations.py
      - name: 保存估值快照
        run: |
          git config user.name "Paper Valuation Bot"
          git config user.email "actions@github.com"
          git add "state/valuations/latest.json"
          git diff --cached --quiet && exit 0
          git commit -m "更新PAPER独立估值快照"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "估值快照未能可靠写回"
          exit 1
